<div class="filter-chips">
  @for (item of items; track item.name) {
    @for (chip of item.chips; track chip.label) {
      <fs-chip size="small">
        <fs-filter-chip-text
          [text]="chip.value ? chip.label + ': ' + chip.value : chip.label"
          [more]="chip.more">
        </fs-filter-chip-text>
      </fs-chip>
    }
  }
</div>
