<!--
  The badge sits on the icon, not the button, so it stays inside the button's padding and
  is not clipped when the button is the last thing in the bar. The tooltip and the
  accessible name are the same text, so the tooltip is not announced a second time.
-->
<button
    type="button"
    mat-icon-button
    aria-haspopup="dialog"
    [matTooltip]="label()"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="panelOpen()"
    [disabled]="disabled()"
    (click)="open()">
  <mat-icon
      [matBadge]="activeCount()"
      [matBadgeHidden]="!activeCount()"
      [matBadgeSize]="'small'">
    filter_list
  </mat-icon>
</button>
<!--
  Reset heads the flyout beside the count it clears, so it stays in one place under the
  button however long the list of filters runs. The count is of the filters applied, defaults
  among them. Reset is never disabled: a count always offers a way to act on it, and Reset
  puts every filter back to its default. Every filter is listed whether applied or not: the
  applied ones first, in the primary color with their values under their names (a checkbox
  filter's reads 'Selected'), then a divider and the rest.
-->
<ng-template #panel>
  <div
      class="filter-menu-panel"
      role="dialog"
      aria-label="Filters">
    <div class="filter-menu-heading">
      <span class="filter-menu-title">Filters</span>
      @if (activeCount()) {
        <span class="small">{{ activeCount() }} active</span>
      }
      <button
          type="button"
          mat-button
          class="filter-menu-reset"
          (click)="reset()">
        Reset
      </button>
    </div>
    @if (items().length) {
      <mat-divider></mat-divider>
      <mat-action-list class="filter-menu-items">
        @for (group of groups(); track $index) {
          @if (!$first) {
            <mat-divider class="filter-menu-group-divider"></mat-divider>
          }
          @for (item of group; track item.name) {
            <button
                type="button"
                mat-list-item
                [class.applied]="item.hasValue"
                [attr.aria-pressed]="item.isTypeCheckbox ? item.hasValue : null"
                (click)="pickItem(item)">
              <span matListItemTitle>{{ item.mergedLabel }}</span>
              @if (item.hasValue && summary(item); as value) {
                <span matListItemLine>
                  <small>
                    <fs-filter-chip-text
                      [text]="value.text"
                      [more]="value.more">
                    </fs-filter-chip-text>
                  </small>
                </span>
              }
            </button>
          }
        }
      </mat-action-list>
    }
  </div>
</ng-template>
