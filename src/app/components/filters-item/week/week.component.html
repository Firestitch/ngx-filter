<!-- A chip's popup (overlayRef set) has no clear button, so nothing in it reads as "close" while wiping the filter; the chip's remove icon clears it. -->
<mat-form-field
    [floatLabel]="floatLabel"
    class="form-field-padless">
  <mat-label>
    {{ item.label }}
  </mat-label>
  <input
    matInput
    fsDateWeekPicker
    [placeholder]="item.label"
    [fsFilterFocusTrigger]="autofocus"
    [(ngModel)]="value"
    [disabled]="disabled"
    (ngModelChange)="item.value = value"
    [seedDate]="item.seedDate"
    [clear]="item.clearable && !overlayRef"
    [name]="item.name">
</mat-form-field>
