<mat-form-field
    [floatLabel]="floatLabel"
    class="form-field-padless">
  <mat-label>
    {{ item.label }}
  </mat-label>
  @if (item.prefix) {
    <div
      matTextPrefix
      [innerHtml]="item.prefix">
    </div>
  }
  <input
    matInput
    [(ngModel)]="value"
    [disabled]="disabled"
    (keyup)="keyup($event)"
    (fsModelChange)="change()"
    [placeholder]="item.placeholder"
    [fsFilterFocusTrigger]="autofocus">
  @if (item.suffix) {
    <div
      matTextSuffix
      [innerHtml]="item.suffix">
    </div>
  }
</mat-form-field>
