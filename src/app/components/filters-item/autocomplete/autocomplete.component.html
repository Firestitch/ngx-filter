<!-- A chip's popup (overlayRef set) has no clear button, so nothing in it reads as "close" while wiping the filter; the chip's remove icon clears it. -->
<fs-autocomplete
    [fsFilterFocusTrigger]="autofocus"
    [fetch]="fetch"
    [displayWith]="displayWith"
    [(ngModel)]="value"
    (ngModelChange)="change()"
    [disabled]="disabled"
    [placeholder]="item.placeholder ?? item.label"
    [fetchOnFocus]="item.fetchOnFocus"
    [showClear]="item.clearable && !overlayRef"
    formFieldClass="form-field-padless"
    name="item.name">
  <ng-template
      fsAutocompleteTemplate
      let-data="data">
    {{ data.name ?? data.value }}
  </ng-template>
</fs-autocomplete>
