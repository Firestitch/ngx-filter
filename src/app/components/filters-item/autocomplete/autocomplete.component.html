<fs-autocomplete
    [fsFilterFocusTrigger]="autofocus"
    [fetch]="fetch"
    [displayWith]="displayWith"
    [(ngModel)]="value"
    (ngModelChange)="change()"
    [disabled]="disabled"
    [placeholder]="item.placeholder ?? item.label"
    [fetchOnFocus]="item.fetchOnFocus"
    [showClear]="item.clearable"
    formFieldClass="form-field-padless"
    name="item.name">
  <ng-template
      fsAutocompleteTemplate
      let-data="data">
    {{ data.name }}
  </ng-template>
</fs-autocomplete>
