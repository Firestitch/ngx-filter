<!-- A chip's popup (overlayRef set) has no clear button, so nothing in it reads as "close" while wiping the filter; the chip's remove icon clears it. -->
@if (initialized) {
  <div class="row">
    <!-- 'to' ends the from field's line, so a pair too wide for the popup still reads as a range when the to field drops under it. -->
    <div class="from">
      <mat-form-field
          [floatLabel]="floatLabel"
          class="form-field-padless">
        <mat-label>
          {{ item.fromLabel }}
        </mat-label>
        <input
          matInput
          [fsFilterFocusTrigger]="autofocusName === 'from'"
          [fsMonthRangeFrom]="item.name"
          [(ngModel)]="from"
          [disabled]="disabled"
          (ngModelChange)="change()"
          [clear]="item.clearable && !overlayRef"
          name="dateFrom">
      </mat-form-field>
      <div class="to">
        to
      </div>
    </div>
    <mat-form-field
        [floatLabel]="floatLabel"
        class="form-field-padless">
      <mat-label>
        {{ item.toLabel }}
      </mat-label>
      <input
        matInput
        [fsFilterFocusTrigger]="autofocusName === 'to'"
        [fsMonthRangeTo]="item.name"
        [(ngModel)]="to"
        [disabled]="disabled"
        (ngModelChange)="change()"
        [clear]="item.clearable && !overlayRef"
        name="dateTo">
    </mat-form-field>
  </div>
}
