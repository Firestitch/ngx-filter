<!--
  The prefix and suffix are text affixes, so they keep the field's padding instead of sitting
  flush against its edge. No type="number": its spinner arrows render in the same gutter as the
  suffix; inputmode keeps the numeric keypad on a phone and fsFormNumeric flags a non-number.
-->
<div class="form-field">
  <mat-form-field
      class="filter-range-min form-field-padless"
      [floatLabel]="floatLabel">
    <mat-label>
      {{ item.minLabel }}
    </mat-label>
    @if (item.prefix) {
      <div
        matTextPrefix
        [innerHtml]="item.prefix">
      </div>
    }
    <input
      matInput
      [fsFilterFocusTrigger]="autofocusName === 'min' || minIsEmpty"
      inputmode="decimal"
      [fsFormNumeric]="true"
      [(ngModel)]="min"
      [disabled]="disabled"
      (fsModelChange)="change()"
      (keyup)="keyup($event)"
      #from>
    @if (item.suffix) {
      <div
        matTextSuffix
        [innerHtml]="item.suffix">
      </div>
    }
  </mat-form-field>
  <mat-form-field
      class="filter-range-max form-field-padless"
      [floatLabel]="floatLabel">
    <mat-label>
      {{ item.maxLabel }}
    </mat-label>
    @if (item.prefix) {
      <div
        matTextPrefix
        [innerHtml]="item.prefix">
      </div>
    }
    <input
      matInput
      [fsFilterFocusTrigger]="autofocusName === 'max' || !minIsEmpty"
      inputmode="decimal"
      [fsFormNumeric]="true"
      [(ngModel)]="max"
      [disabled]="disabled"
      (fsModelChange)="change()"
      (keyup)="keyup($event)"
      #to>
    @if (item.suffix) {
      <div
        matTextSuffix
        [innerHtml]="item.suffix">
      </div>
    }
  </mat-form-field>
</div>
